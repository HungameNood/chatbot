<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chatbot Lịch sử Việt Nam</title>
<style>
:root{--red:#b3261e;--gold:#f2c14e;--bg:#faf6ef;--ink:#2b2118;--line:#e6dccb}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;justify-content:center}
.app{display:flex;flex-direction:column;width:100%;max-width:720px;height:100%;background:#fff;border-left:1px solid var(--line);border-right:1px solid var(--line)}
header{background:var(--red);color:#fff;padding:14px 18px;border-bottom:4px solid var(--gold)}
header h1{margin:0;font-size:1.15rem}
header p{margin:2px 0 0;font-size:.82rem;opacity:.85}
#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.msg{max-width:85%;padding:10px 14px;border-radius:14px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.bot{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.user{align-self:flex-end;background:var(--red);color:#fff;border-bottom-right-radius:4px}
.chips{align-self:flex-start;display:flex;flex-wrap:wrap;gap:8px;max-width:95%}
.chips button{font:inherit;font-size:.9rem;padding:7px 14px;border-radius:999px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer}
.chips button:hover{background:var(--red);color:#fff}
form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);background:#fff}
input{flex:1;min-width:0;font:inherit;padding:10px 14px;border:1px solid var(--line);border-radius:999px;outline:none}
input:focus{border-color:var(--red)}
form button{font:inherit;padding:10px 18px;border:0;border-radius:999px;background:var(--red);color:#fff;cursor:pointer}
</style>
</head>
<body>
<div class="app">
<header><h1>Chatbot Lịch sử Việt Nam</h1><p>Hỏi về các mốc lịch sử và triều đại</p></header>
<div id="log" aria-live="polite"></div>
<form id="f"><input id="q" autocomplete="off" placeholder="Nhập câu hỏi, ví dụ: Điện Biên Phủ" aria-label="Câu hỏi"><button>Gửi</button></form>
</div>
<script>
const API="https://TEN-APP-CUA-BAN.onrender.com";
const sid=Array.from(crypto.getRandomValues(new Uint8Array(12)),b=>b.toString(16).padStart(2,"0")).join("");
const log=document.getElementById("log"),form=document.getElementById("f"),inp=document.getElementById("q");
function add(cls,text){const d=document.createElement("div");d.className="msg "+cls;d.textContent=text;log.appendChild(d);log.scrollTop=log.scrollHeight;return d;}
function clearChips(){document.querySelectorAll(".chips").forEach(e=>e.remove());}
function showChips(labels){
  if(!labels||!labels.length)return;
  const w=document.createElement("div");w.className="chips";
  labels.forEach(l=>{const b=document.createElement("button");b.type="button";b.textContent=l;b.onclick=()=>send(l);w.appendChild(b);});
  log.appendChild(w);log.scrollTop=log.scrollHeight;
}
async function ask(text){
  const r=await fetch(API+"/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:text,sessionId:sid})});
  if(!r.ok)throw new Error(r.status);
  return r.json();
}
async function turn(text,prefix){
  const wait=add("bot","Đang trả lời...");
  try{
    const d=await ask(text);
    wait.remove();
    add("bot",(prefix||"")+(d.text||"Mình chưa có câu trả lời cho câu này."));
    showChips(d.chips);
  }catch(e){
    wait.remove();
    add("bot","Không kết nối được máy chủ. Nếu server vừa ngủ, đợi khoảng 1 phút rồi thử lại nhé.");
  }
}
function send(text){text=text.trim();if(!text)return;clearChips();add("user",text);turn(text);}
form.onsubmit=e=>{e.preventDefault();const v=inp.value;inp.value="";send(v);};
turn("gợi ý chủ đề","Xin chào! ");
inp.focus();
</script>
</body>
</html>
